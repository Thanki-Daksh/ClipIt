<!-- Clip Quick Editor & Subtitle Modal Dialog (TSK-A04-05 Inline Editor) -->
<div id="clipModal" class="modal-overlay">
  <div class="modal-card glass-panel">
    <div class="modal-header">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-purple-500 inline-block shadow-sm shadow-purple-400"></span>
        <h3 class="font-bold text-base text-white">Modal Subtitle Inline Editor</h3>
      </div>
      <button onclick="closeModal()" class="text-gray-400 hover:text-white text-xl font-bold px-2">&times;</button>
    </div>

    <div class="modal-body">
      <!-- Embedded Video Player Preview -->
      <div class="video-container rounded-xl overflow-hidden mb-3 max-h-64 shadow-lg border border-white/10">
        <video id="modalVideoPlayer" controls playsinline class="w-full h-full object-cover">
          <source id="modalVideoSource" src="" type="video/mp4">
          Your browser does not support HTML5 video player.
        </video>
      </div>

      <!-- Subtitle Editor Header -->
      <div class="flex justify-between items-center mt-2 mb-1">
        <div class="flex items-center gap-2">
          <label class="text-xs font-semibold text-gray-300 uppercase tracking-wider">Subtitles & Timings</label>
          <span class="text-[10px] text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded-full border border-cyan-500/20">Live Sync</span>
        </div>
        <button onclick="addSubtitleRow()" class="text-xs text-purple-400 hover:text-purple-300 font-bold flex items-center gap-1">
          + Add Line
        </button>
      </div>

      <!-- Subtitles List Container -->
      <div id="subtitlesList" class="flex flex-col gap-2 max-h-52 overflow-y-auto pr-1">
        <!-- Subtitle rows will be rendered dynamically here -->
      </div>
    </div>

    <div class="modal-footer p-4 border-t border-white/10 flex justify-between items-center bg-black/30">
      <button onclick="formatSubtitlesUppercase()" class="text-xs text-gray-400 hover:text-gray-200 underline font-medium">
        Aa UPPERCASE
      </button>
      <div class="flex gap-2">
        <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-400 hover:text-white bg-white/5 border border-white/10">
          Cancel
        </button>
        <button onclick="saveSubtitles()" class="px-5 py-2 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-purple-600 to-pink-600 shadow-lg shadow-purple-500/30 hover:opacity-95">
          Save & Update Clip
        </button>
      </div>
    </div>
  </div>
</div>
